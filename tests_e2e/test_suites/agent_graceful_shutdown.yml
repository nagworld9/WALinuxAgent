#
# This test validates that the ext-handler shuts down gracefully when SIGTERM is delivered to it
# (e.g. by `systemctl stop`). It checks that every background thread the agent starts is signaled
# to stop and logs a terminal shutdown status, while the overall shutdown completes within the
# allowed clock bound
#
name: "AgentGracefulShutdown"
tests:
  - "agent_graceful_shutdown/agent_graceful_shutdown.py"
images:
  - "endorsed"
  - "endorsed-arm64"
skip_on_images:
  # Oracle 7.9 is excluded from this test, since agent stop behaving differently and
  # not waiting for the background threads to stop before exiting, which causes the test to fail.
  - "oracle_79"
