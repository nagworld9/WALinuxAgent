#
# The test suite verifies the agent is running in expected cgroups, checks agent tracking the cgroups for polling resource metrics,
# checks unexpected processes in the agent cgroups, verifies the agent cpu quota is set as expected, and verifies the agent
# does not set a cgroup memory limit (self-monitors anon memory usage instead).
#
name: "AgentCgroups"
tests:
  - "agent_cgroups/agent_cgroups.py"
  - "agent_cgroups/agent_cpu_quota.py"
  - "agent_cgroups/agent_memory_quota.py"
  - "agent_cgroups/agent_cgroups_process_check.py"
images:
  - "cgroups-endorsed"
  # TODO : Currently some extensions(AMA, VMAccess) do not support 25_10. Move this image to the "cgroups-endorsed" image set once those issues have been fixed.
  - "ubuntu_2510"
owns_vm: true
skip_on_images: # AMA extension used in agent_cgroups_process_check, and it is not supported on these images
  - "rhel_95_arm64"